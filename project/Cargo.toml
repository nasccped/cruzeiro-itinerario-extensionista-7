[package]
name = "project"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.13.0"
dotenv = "0.15.0"
env_logger = "0.11.10"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["chrono", "macros", "postgres", "runtime-tokio", "time"] }
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["serde"] }
